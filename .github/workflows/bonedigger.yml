name: bonedigger

# FORK: automatic triggers disabled — this fork runs no CI except ci.yml.
# Upstream triggers were: issues [opened, labeled, closed], issue_comment [created],
# schedule cron '0 9 * * *'. Restore them if this fork ever needs issue lifecycle automation.
on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  bonedigger:
    uses: projectbluefin/bonedigger/.github/workflows/lifecycle.yml@d53076732c23203efd7856eaee7c502742897603 # v1
    with:
      brand_name: "Bluefin"
      brand_emoji: "🦖"
    secrets: inherit
